name: CI

on:
  push:
    paths: ['lab6/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['lab6/**', '.github/workflows/ci.yml']

defaults:
  run:
    shell: bash
    working-directory: lab6

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Cache ccache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('lab6/CMakeLists.txt', 'lab6/third_party/**') }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache

      - name: Configure
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
            LAUNCHER="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 $LAUNCHER

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --output-junit test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: lab6/build/test-results.xml